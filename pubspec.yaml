name: kutemukan
description: KutemuKan - Lost and Found Unindra
publish_to: "none"
version: 1.9.7+52

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  qr_flutter: ^4.1.0
  flutter_zxing: ^2.2.1
  permission_handler: ^11.3.1
  pdf: ^3.11.1
  printing: ^5.13.4
  record: ^6.1.2
  audioplayers: ^6.4.0
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^6.2.1
  app_links: ^6.3.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/maskot.png
    - assets/logo.png
    - assets/burung.png
    - assets/splash.png
    - assets/icon.png
    - assets/icons/google.png
    - assets/icons/instagram.png
    - assets/icons/whatsapp.png
    - assets/icons/linkedin.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon-penuh.png"
  adaptive_icon_background: "#F3EFE6"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0061C9"
  android_12:
    color: "#0061C9"

dependency_overrides:
  # file_picker 8.1.7 terkompilasi dengan Android SDK 34, sedangkan
  # flutter_plugin_android_lifecycle terbaru menuntut SDK 36 dan membuat
  # pemeriksaan metadata AAR Gradle gagal. Kunci di 2.0.22 (SDK 34).
  flutter_plugin_android_lifecycle: 2.0.22
