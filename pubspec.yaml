name: kutemukan
description: KutemuKan - Lost and Found Kampus Unindrabase
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maskot.jpg
    - assets/icon.png

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0F766E"
  image: assets/icon.png
  android_12:
    color: "#0F766E"
    image: assets/icon.png
