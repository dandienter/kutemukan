name: kutemukan
description: KutemuKan - Lost and Found Unindra
publish_to: "none"
version: 1.3.2+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2
  http: ^1.2.0
  url_launcher: ^6.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  flutter_image_compress: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.0.0
  share_plus: ^10.1.4
  font_awesome_flutter: ^10.8.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/maskot.png
    - assets/splash.png
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0F766E"
  adaptive_icon_foreground: "assets/icon.png"

flutter_native_splash:
  color: "#0F766E"
  android_12:
    color: "#0F766E"
