name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable

      - name: Scaffold Android lalu timpa sumber aplikasi
        run: |
          mkdir -p /tmp/scaffold
          cd /tmp/scaffold
          flutter create --org com.kutemukan --project-name kutemukan scaffoldapp
          cd $GITHUB_WORKSPACE
          cp -r /tmp/scaffold/scaffoldapp/android ./android
          mkdir -p assets/icon
          if [ -f assets/icon/icon.png ]; then
            cp assets/icon/icon.png /tmp/icon.png
          fi

      - name: Patch applicationId menjadi com.kutemukan.id
        run: |
          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            sed -i 's/applicationId = "[^"]*"/applicationId = "com.kutemukan.id"/' $GRADLE
            grep applicationId $GRADLE
          else
            sed -i 's/applicationId "[^"]*"/applicationId "com.kutemukan.id"/' android/app/build.gradle
            grep applicationId android/app/build.gradle
          fi

      - name: Patch manifest (label + izin internet)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="kutemukan"/android:label="KutemuKan"/' $MANIFEST
          grep -q 'android.permission.INTERNET' $MANIFEST || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' $MANIFEST
          for P in RECORD_AUDIO ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CAMERA; do grep -q "android.permission.$P" $MANIFEST || sed -i "s|<application|<uses-permission android:name=\"android.permission.$P\"/>\n    <application|" $MANIFEST; done
          python3 - <<'PYEOF'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          if 'login-callback' not in s:
              filt = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="kutemukan" android:host="login-callback" />
              </intent-filter>
              '''
              s = s.replace('</activity>', filt + '</activity>', 1)
              open(p, 'w').write(s)
          s = open(p).read()
          if 'android:host="post"' not in s:
              filt2 = '''<intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="kutemukan" android:host="post" />
              </intent-filter>
              '''
              s = s.replace('</activity>', filt2 + '</activity>', 1)
              open(p, 'w').write(s)
          print(open(p).read())
          PYEOF

      - name: Pasang Firebase (google-services)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json')); print('google-services.json valid, sumber: GitHub Secrets')"
          python3 - <<'PYEOF'
          p = 'android/settings.gradle.kts'
          s = open(p).read()
          if 'google-services' not in s:
              s = s.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
              open(p, 'w').write(s)
          p2 = 'android/app/build.gradle.kts'
          s2 = open(p2).read()
          if 'google-services' not in s2:
              s2 = s2.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services")', 1)
          if 'abiFilters' not in s2:
              s2 = s2.replace('defaultConfig {', 'defaultConfig {\n        ndk { abiFilters.add("arm64-v8a") }', 1)
          open(p2, 'w').write(s2)
          print('firebase terpasang')
          PYEOF

      - name: Terapkan ikon launcher dan splash screen
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Pasang keystore rilis tetap
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/kutemukan.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=kutemukan.jks
          EOF
          python3 - <<'PYEOF'
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          if 'keystoreProperties' not in s:
              muat = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }
          '''
              s = s.replace('android {', muat + '\nandroid {', 1)
              configs = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String?
                      keyPassword = keystoreProperties["keyPassword"] as String?
                      storeFile = keystoreProperties["storeFile"]?.let { file(it) }
                      storePassword = keystoreProperties["storePassword"] as String?
                  }
              }
          '''
              s = s.replace('buildTypes {', configs + '    buildTypes {', 1)
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("release")')
              open(p, 'w').write(s)
          print('signing rilis terpasang')
          PYEOF

      - name: Build APK release (arm64)
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KutemuKan.apk

      - name: Rampingkan APK (buang pustaka non-arm64, tanda tangan ulang)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          python3 - <<'PYEOF'
          import zipfile
          src = 'build/app/outputs/flutter-apk/KutemuKan.apk'
          dst = 'build/app/outputs/flutter-apk/KutemuKan-mentah.apk'
          zin = zipfile.ZipFile(src)
          zout = zipfile.ZipFile(dst, 'w')
          dibuang = 0
          for item in zin.infolist():
              if item.filename.startswith(('lib/x86_64/', 'lib/armeabi-v7a/', 'META-INF/')):
                  dibuang += item.file_size
                  continue
              zout.writestr(item, zin.read(item.filename), compress_type=item.compress_type)
          zout.close()
          print(f'pustaka non-arm64 dibuang: {dibuang} byte')
          PYEOF
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -p -f 4 build/app/outputs/flutter-apk/KutemuKan-mentah.apk build/app/outputs/flutter-apk/KutemuKan-sejajar.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks android/app/kutemukan.jks --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out build/app/outputs/flutter-apk/KutemuKan.apk build/app/outputs/flutter-apk/KutemuKan-sejajar.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify build/app/outputs/flutter-apk/KutemuKan.apk
          ls -la build/app/outputs/flutter-apk/KutemuKan.apk

      - name: Terbitkan Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KutemuKan build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/KutemuKan.apk
